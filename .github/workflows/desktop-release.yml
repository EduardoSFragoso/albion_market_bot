name: Desktop release

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Ensure tag points to merged code
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^desktop-v\d+\.\d+\.\d+$') {
            throw 'Use a release tag in the format desktop-vX.Y.Z.'
          }
          git fetch origin main
          git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tags must point to a commit already merged into main.'
          }

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop-client/frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: desktop-client/go.mod
          cache-dependency-path: desktop-client/go.sum

      - name: Install desktop frontend dependencies
        working-directory: desktop-client/frontend
        run: npm ci

      - name: Build desktop frontend
        working-directory: desktop-client/frontend
        run: npm run build

      - name: Build executable
        working-directory: desktop-client
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^desktop-v', ''
          $ldflags = "-s -w -X main.version=$version"
          go build -ldflags="$ldflags" -o "$env:RUNNER_TEMP\albion-market-archive.exe" .

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'albion-market-archive.exe'
          $checksum = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  albion-market-archive.exe" | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt') -Encoding ascii

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^desktop-v', ''
          gh release create "$env:GITHUB_REF_NAME" `
            (Join-Path $env:RUNNER_TEMP 'albion-market-archive.exe') `
            (Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt') `
            --title "Albion Market Archive v$version" `
            --generate-notes
