name: CI

# Portão do merge (ver docs/configuracao-repositorio.md): roda a matriz de validação
# descrita no AGENTS — typecheck, sanity, testes por camada e builds.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-core-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (todos os workspaces)
        run: npm run typecheck

      - name: Sanity do core (asserts de resultado conhecido, sem rede)
        run: npx tsx packages/core/test/sanity.ts

      - name: Testes do bot (assinatura e replay)
        run: npm run test:bot

      - name: Testes do cache da API do core
        run: npm run test:api-cache

      - name: Testes de validação da API web
        run: npm run test:web-validation

      - name: Testes de formatação do site
        run: npm run test:web-format

      - name: Testes do rate limiter da API
        run: npm run test:api-rate-limit

      - name: Build do Worker limitador (dry-run)
        run: npm run build:api-limiter

      - name: Build do site (o que o Pages publica)
        run: npm run build:web

      - name: Bot — script de registro compila
        run: node --check apps/bot/scripts/register-commands.mjs

  desktop-client-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop-client/frontend/package-lock.json

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: desktop-client/go.mod
          cache-dependency-path: desktop-client/go.sum

      - name: Instalar dependências do frontend desktop
        working-directory: desktop-client/frontend
        run: npm ci

      - name: Testes do frontend desktop
        working-directory: desktop-client/frontend
        run: npm test

      - name: Build do frontend desktop
        working-directory: desktop-client/frontend
        run: npm run build

      - name: Testes Go completos do app desktop
        working-directory: desktop-client
        run: go test ./...

      - name: Análise estática Go do app desktop
        working-directory: desktop-client
        run: go vet ./...

      - name: Compilar executável do app desktop
        working-directory: desktop-client
        shell: pwsh
        run: .\scripts\build-windows.ps1 -OutputPath (Join-Path $env:RUNNER_TEMP 'albion-market-archive.exe') -Version '0.0.0-ci'

  check:
    if: always()
    needs: [verify-core-web, desktop-client-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir sucesso das suítes Linux e Windows
        env:
          CORE_WEB_RESULT: ${{ needs.verify-core-web.result }}
          DESKTOP_WINDOWS_RESULT: ${{ needs.desktop-client-windows.result }}
        run: |
          if [[ "$CORE_WEB_RESULT" != "success" || "$DESKTOP_WINDOWS_RESULT" != "success" ]]; then
            echo "CI incompleta: core/web=$CORE_WEB_RESULT; desktop Windows=$DESKTOP_WINDOWS_RESULT"
            exit 1
          fi
